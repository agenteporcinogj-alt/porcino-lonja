name: pipeline diario
on:
  schedule:
    - cron: '*/30 6-18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pipeline-diario
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Ejecutar pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
        run: python pipeline.py
      - name: Guardar resultados
        run: |
          git config user.name "porcino-bot"
          git config user.email "bot@users.noreply.github.com"
          add_all() {
            git add data/master.xlsx data/validacion_modelo.csv docs/data.enc.js
            [ -f data/correos_vistos.txt ] && git add data/correos_vistos.txt || true
          }
          add_all
          git diff --cached --quiet && { echo "sin cambios"; exit 0; }
          # Reaplicamos NUESTROS ficheros regenerados SOBRE el ultimo origin, sin fusionar binarios
          # (reset --soft nunca entra en conflicto; nuestra version, la mas fresca, siempre gana).
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset --soft origin/main
            add_all
            git diff --cached --quiet && { echo "ya estaba al dia"; exit 0; }
            git commit -q -m "Actualizacion automatica $(date +%F)"
            git push -q && { echo "push OK (intento $i)"; exit 0; }
            echo "push colisiono, reintento $i..."; sleep $((RANDOM % 8 + 3))
          done
          echo "no se pudo pushear tras varios reintentos"; exit 1
