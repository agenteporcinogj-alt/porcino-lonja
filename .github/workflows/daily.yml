name: pipeline diario
on:
  schedule:
    - cron: '*/30 6-18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pipeline-diario
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Ejecutar pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
        run: python pipeline.py
      - name: Guardar resultados
        run: |
          git config user.name "porcino-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/master.xlsx data/validacion_modelo.csv docs/data.enc.js
          [ -f data/correos_vistos.txt ] && git add data/correos_vistos.txt || true
          git commit -m "Actualizacion automatica $(date +%F)" || { echo "sin cambios"; exit 0; }
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push colisiono, reintento $i..."; sleep $((RANDOM % 10 + 5))
          done
          echo "no se pudo pushear tras 5 reintentos"; exit 1
