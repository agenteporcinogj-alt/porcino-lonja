name: pipeline diario
on:
  schedule:
    - cron: '*/30 6-18 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Ejecutar pipeline
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEB_PASSWORD: ${{ secrets.WEB_PASSWORD }}
        run: python pipeline.py
      - name: Guardar resultados
        run: |
          git config user.name "porcino-bot"
          git config user.email "bot@users.noreply.github.com"
          # Solo commiteamos los DATOS regenerados. Nunca tocamos codigo/workflow.
          FILES="data/master.xlsx data/validacion_modelo.csv docs/data.enc.js data/correos_vistos.txt data/contexto_mercado.json data/predicciones_congeladas.jsonl"
          mkdir -p /tmp/gen
          for f in $FILES; do [ -f "$f" ] && cp "$f" "/tmp/gen/$(echo $f | tr / _)" || true; done
          for i in 1 2 3 4 5 6; do
            git fetch -q origin main
            git reset --hard -q origin/main        # arbol limpio en el ULTIMO origin (codigo correcto)
            for f in $FILES; do s="/tmp/gen/$(echo $f | tr / _)"; [ -f "$s" ] && cp "$s" "$f" || true; done
            for f in $FILES; do [ -f "$f" ] && git add "$f" || true; done
            git diff --cached --quiet && { echo "sin cambios"; exit 0; }
            git commit -q -m "Actualizacion automatica $(date +%F)"
            git push -q && { echo "push OK (intento $i)"; exit 0; }
            echo "colision, reintento $i..."; sleep $((RANDOM % 8 + 3))
          done
          echo "no se pudo pushear tras varios reintentos"; exit 1
